name: Release Please

# release-please maintains a "release PR" that bumps the version + CHANGELOG from Conventional
# Commits; merging it cuts the release (tag `vX.Y.Z` + GitHub Release). The CLI binaries are built
# and uploaded in the same run (gated on release_created), so no PAT is needed — the default
# GITHUB_TOKEN can't trigger a *separate* tag-driven workflow, but this runs in-workflow.
#
# krayt ships no VM image (retire-vm-image-pipeline.md) — msb owns the sandbox image entirely
# (docs/adr-microsandbox-sandbox-layer.md). See RELEASING.md.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  cli-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Embed the guest binaries (add-krayt-guest-helper.md) before the cross-build loop below,
      # so the released krayt binary embeds real krayt-helper binaries rather than an empty
      # bin/ (.gitkeep only). This runner is already Linux with Go installed, so it's one line
      # and no new runner; CGO stays off for this too (guest-bins itself sets CGO_ENABLED=0).
      - run: make guest-bins

      # Pure-Go (CGO off): one Linux runner cross-builds every Unix target. darwin/arm64 is the
      # supported macOS target; darwin/amd64 builds but is untested (see README). linux/amd64 and
      # linux/arm64 are both supported Linux targets — msb's own platform support is what gated
      # linux/arm64, and the old blocker (a krayt-owned, backend-tagged VM image with no arm64
      # Firecracker variant) went with the rest of the image pipeline (retire-vm-image-pipeline.md,
      # expand-platforms-under-msb.md).
      - name: Build krayt (darwin/arm64, darwin/amd64, linux/amd64, linux/arm64)
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o dist/krayt ./cmd/krayt
            tar -C dist -czf "dist/krayt_${TAG}_${os}_${arch}.tar.gz" krayt
            rm dist/krayt
          done

      # Windows gets a .zip, not a .tar.gz — the native convention there (Explorer opens .zip
      # without extra tooling; tar.gz needs a third-party unpacker on stock Windows).
      - name: Build krayt (windows/amd64)
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/krayt.exe ./cmd/krayt
          (cd dist && zip "krayt_${TAG}_windows_amd64.zip" krayt.exe)
          rm dist/krayt.exe

      - name: Checksums
        run: (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Upload binaries to the release
        run: gh release upload "$TAG" dist/krayt_*.tar.gz dist/krayt_*.zip dist/checksums.txt --clobber
