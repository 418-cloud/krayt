version: "2"

# The few remaining OS-specific files (cmd/krayt-helper, cmd/krayt-ask's vsock dialer,
# internal/cli/resources_*.go) are linted under their native GOOS by running the CI lint job on
# both macOS and Linux — not via build-tags, which would leave GOOS mismatched and break stdlib
# typechecking.

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
